<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="navyTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3F6D"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="navySide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132D52"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>
    <linearGradient id="navyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2240"/>
      <stop offset="100%" stop-color="#050E1D"/>
    </linearGradient>
    <linearGradient id="glassBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF8D"/>
      <stop offset="45%" stop-color="#D4A643"/>
      <stop offset="100%" stop-color="#8B6418"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B1F3A" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#0B1F3A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="#FFFFFF"/>
  <ellipse cx="128" cy="216" rx="76" ry="16" fill="url(#floorShadow)"/>
  <!-- Back Glass Pedestal Disc -->
  <ellipse cx="128" cy="182" rx="74" ry="26" fill="url(#navyDark)"/>
  <ellipse cx="128" cy="174" rx="74" ry="26" fill="url(#navyTop)"/>
  <ellipse cx="128" cy="174" rx="62" ry="19" fill="url(#glassBlue)" opacity="0.65"/>
  <!-- 3D Sculpted Heart -->
  <path d="M128,176 C128,176 58,132 58,86 C58,60 79,42 103,42 C117,42 125,50 128,58 C131,50 139,42 153,42 C177,42 198,60 198,86 C198,132 128,176 128,176 Z" fill="url(#navyTop)" transform="translate(6,6)" opacity="0.35"/>
  <path d="M128,172 C128,172 58,128 58,82 C58,56 79,38 103,38 C117,38 125,46 128,54 C131,46 139,38 153,38 C177,38 198,56 198,82 C198,128 128,172 128,172 Z" fill="url(#gold)"/>
  <!-- Inner Glass Heart Core -->
  <path d="M128,152 C128,152 76,118 76,84 C76,67 90,55 106,55 C116,55 124,61 128,68 C132,61 140,55 150,55 C166,55 180,67 180,84 C180,118 128,152 128,152 Z" fill="url(#glassBlue)"/>
  <!-- Specular Highlight -->
  <path d="M90,74 C92,64 102,60 112,62" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- Rising Gold Plus/Spark -->
  <rect x="122" y="84" width="12" height="36" rx="4" fill="url(#goldLight)"/>
  <rect x="110" y="96" width="36" height="12" rx="4" fill="url(#goldLight)"/>
</svg>
